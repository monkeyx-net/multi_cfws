odroidgoa-uboot-config

# ---- G350 dual-boot: dArkOS (default) / AmberELEC (hold Vol- at power-on) ----
# Vol- = GPIO2_A1 = pin 65, active low (rk3326-g350-linux.dtb gpio-keys).
# U-Boot 2017.09 "gpio input" returns the pin value as exit status, so it is
# "true" (0) only while Vol- is held. If the command fails, dArkOS boots.
#
# Layout: p1 AMBRELC (this file) | p2 AmberELEC STORAGE | p3 GAMES (AmberELEC roms, exFAT)
#         p5 EASYROMS (dArkOS roms, exFAT) | p6 dArkOS BOOT | p7 dArkOS ROOTFS
# AmberELEC updates overwrite this file: restore it from boot.ini.dualboot.

if gpio input 65; then
  # AmberELEC
  setenv fdt_addr_r "0x01f00000"
  setenv loadaddr "0x00200000"
  setenv scriptaddr "0x00500000"
  setenv kernel_addr_r "0x02008000"
  sysboot mmc 1:1 any ${scriptaddr} /extlinux/rk3326-rg351mp-linux.dtb.conf
else
  # dArkOS
  setenv bootargs "root=PARTUUID=5a3c9e71-07 rootwait rw fsck.repair=yes net.ifnames=0 fbcon=rotate:0 console=/dev/ttyFIQ0 quiet splash consoleblank=0 vt.global_cursor_default=0"
  setenv loadaddr "0x02000000"
  setenv initrd_loadaddr "0x04000000"
  setenv dtb_loadaddr "0x01f00000"
  load mmc 1:6 ${loadaddr} Image
  load mmc 1:6 ${initrd_loadaddr} uInitrd
  load mmc 1:6 ${dtb_loadaddr} rk3326-g350-linux.dtb
  booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}
fi
